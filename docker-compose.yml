services:
  go-service:
    build: ./services/go
    container_name: go-service
    ports:
      - 8081:8080
    restart: unless-stopped
  node-service:
    build: ./services/node
    container_name: node-service
    ports:
      - 8082:8080
    restart: unless-stopped
  python-service:
    build: ./services/python
    container_name: python-service
    ports:
      - 8083:8080
    restart: unless-stopped
